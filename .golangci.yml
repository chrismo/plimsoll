version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # cli buffers command output and output() checks the one write to
      # stdout; a failed write to stderr has nowhere to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/chrismo/plimsoll

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
